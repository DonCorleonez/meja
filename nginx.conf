server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/manifest+json image/svg+xml;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  types { application/manifest+json webmanifest; }

  # Hashed build assets never change: cache for a year, and 404 when missing (never fall back to HTML).
  location ~ ^/meja-[a-z0-9-]+/assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options nosniff always;
  }

  # Service workers, pages and manifests must always be revalidated so updates arrive.
  location ~ (sw\.js|\.html|\.webmanifest)$ {
    try_files $uri =404;
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options nosniff always;
  }

  # Each game is a single-page app under its own path.
  location ~ ^/(meja-[a-z0-9-]+)/ {
    try_files $uri $uri/ /$1/index.html;
    add_header Cache-Control "no-cache" always;
  }

  # Bare /meja-x -> /meja-x/
  location ~ ^/(meja-[a-z0-9-]+)$ {
    return 301 /$1/;
  }

  location / {
    try_files $uri $uri/ =404;
  }
}
